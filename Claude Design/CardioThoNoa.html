<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CardioThoNoa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset ──────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #0D1B2A;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    /* ── Ambient animated background ───────────────────── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 20% 30%, rgba(30,58,95,0.55) 0%, transparent 70%),
        radial-gradient(ellipse 50% 60% at 80% 70%, rgba(192,57,43,0.18) 0%, transparent 70%),
        radial-gradient(ellipse 70% 40% at 50% 100%, rgba(33,113,181,0.2) 0%, transparent 70%);
      animation: ambientShift 12s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }
    #app-root { position: relative; z-index: 1; }

    /* ── Design tokens — Light ──────────────────────────── */
    :root {
      --font:         'Outfit', system-ui, sans-serif;
      --primary:      #1E3A5F;
      --accent:       #C0392B;

      --bg:           #F4F6F9;
      --surface:      #FFFFFF;
      --surface-2:    #F0F3F7;
      --border:       #E2E8F2;

      --text-1:       #1A1D2E;
      --text-2:       #5B6880;
      --text-3:       #9BA8BA;

      --r-sm:         8px;
      --r-md:         12px;
      --r-lg:         16px;
      --r-xl:         24px;
      --r-pill:       999px;

      --shadow-sm:    0 1px 4px rgba(0,0,0,0.07);
      --shadow-md:    0 4px 14px rgba(0,0,0,0.09);
      --shadow-lg:    0 8px 28px rgba(0,0,0,0.12);
      --shadow-glow:  0 0 20px rgba(30,58,95,0.25);

      /* Glassmorphism */
      --glass-light:        rgba(255, 255, 255, 0.78);
      --glass-strong:       rgba(255, 255, 255, 0.92);
      --glass-border:       rgba(255, 255, 255, 0.55);
      --glass-border-inner: rgba(255, 255, 255, 0.3);
      --blur-sm:  blur(12px);
      --blur-md:  blur(22px);
      --blur-lg:  blur(32px);
    }

    /* ── Design tokens — Dark ───────────────────────────── */
    [data-theme="dark"] {
      --bg:           #0D1B2A;
      --surface:      #162032;
      --surface-2:    #1E2D42;
      --border:       #2A3D55;
      --text-1:       #EEF2F8;
      --text-2:       #8FA3BD;
      --text-3:       #4E6580;
      --shadow-glow:  0 0 20px rgba(30,58,95,0.4);

      --glass-light:        rgba(18, 28, 44, 0.78);
      --glass-strong:       rgba(22, 32, 50, 0.92);
      --glass-border:       rgba(255, 255, 255, 0.09);
      --glass-border-inner: rgba(255, 255, 255, 0.04);
    }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 4px; }
    [data-theme="dark"] ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    /* ── iOS device stage ──────────────────────────────── */
    #app-root {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    ios-device-inner { overflow: hidden !important; }

    /* ════════════════════════════════════════════════════
       KEYFRAMES
    ════════════════════════════════════════════════════ */
    @keyframes ambientShift {
      0%   { opacity: 0.7; transform: scale(1) rotate(0deg); }
      50%  { opacity: 1;   transform: scale(1.04) rotate(1deg); }
      100% { opacity: 0.8; transform: scale(1.02) rotate(-0.5deg); }
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.91); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulseRing {
      0%   { transform: scale(1);    opacity: 0.5; }
      60%  { transform: scale(1.6);  opacity: 0; }
      100% { transform: scale(1.6);  opacity: 0; }
    }
    @keyframes shimmer {
      0%   { background-position: -200% center; }
      100% { background-position:  200% center; }
    }
    @keyframes countUp {
      from { opacity: 0; transform: translateY(8px) scale(0.88); }
      to   { opacity: 1; transform: translateY(0)  scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(20px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes chip-pop {
      0%   { transform: scale(1); }
      40%  { transform: scale(1.18); }
      70%  { transform: scale(0.95); }
      100% { transform: scale(1.03); }
    }
    @keyframes ripple {
      to { transform: scale(4); opacity: 0; }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50%       { transform: translateY(-4px); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(30,58,95,0); }
      50%       { box-shadow: 0 0 16px 4px rgba(30,58,95,0.18); }
    }
    @keyframes gradientBorder {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes tabPop {
      0%   { transform: scaleX(0.6) scaleY(1); }
      50%  { transform: scaleX(1.15) scaleY(0.85); }
      100% { transform: scaleX(1) scaleY(1); }
    }
    @keyframes iconBounce {
      0%   { transform: translateY(0) scale(1); }
      30%  { transform: translateY(-4px) scale(1.15); }
      60%  { transform: translateY(1px) scale(0.95); }
      100% { transform: translateY(0) scale(1); }
    }
    @keyframes progressFill {
      from { width: 0; }
    }
    @keyframes orb-drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(8px, -6px) scale(1.06); }
      66%       { transform: translate(-5px, 4px) scale(0.96); }
    }
    @keyframes borderShimmer {
      0%   { opacity: 0.4; }
      50%  { opacity: 1; }
      100% { opacity: 0.4; }
    }

    /* ── Utility animation classes ─────────────────────── */
    .anim-fade-up   { animation: fadeSlideUp  0.36s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-scale-in  { animation: scaleIn      0.26s cubic-bezier(0.34,1.56,0.64,1) both; }
    .anim-slide-r   { animation: slideInRight 0.30s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-slide-up  { animation: slideInUp    0.30s cubic-bezier(0.22,1,0.36,1) both; }
    .anim-count     { animation: countUp      0.38s cubic-bezier(0.34,1.56,0.64,1) both; }
    .chip-selected  { animation: chip-pop     0.28s cubic-bezier(0.34,1.56,0.64,1) forwards; }

    /* Stagger helpers */
    .stagger-1 { animation-delay: 0.04s; }
    .stagger-2 { animation-delay: 0.09s; }
    .stagger-3 { animation-delay: 0.14s; }
    .stagger-4 { animation-delay: 0.20s; }
    .stagger-5 { animation-delay: 0.27s; }
    .stagger-6 { animation-delay: 0.34s; }

    /* ── Glassmorphism surfaces ────────────────────────── */
    .glass {
      background: var(--glass-light) !important;
      backdrop-filter: var(--blur-md) !important;
      -webkit-backdrop-filter: var(--blur-md) !important;
      border-top: 1px solid var(--glass-border) !important;
    }
    .glass-card {
      background: var(--glass-light);
      backdrop-filter: var(--blur-sm);
      -webkit-backdrop-filter: var(--blur-sm);
      border: 1px solid var(--glass-border);
    }
    /* Premium glass — gradient border via pseudo-element trick */
    .glass-premium {
      position: relative;
      background: var(--glass-strong);
      backdrop-filter: var(--blur-lg);
      -webkit-backdrop-filter: var(--blur-lg);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .glass-premium::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(135deg,
        rgba(255,255,255,0.6) 0%,
        rgba(255,255,255,0.1) 40%,
        rgba(255,255,255,0.05) 60%,
        rgba(255,255,255,0.3) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      pointer-events: none;
      animation: borderShimmer 3s ease-in-out infinite;
    }

    /* ── Form mode-switch pill ─────────────────────────── */
    .mode-pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 14px; border-radius: var(--r-pill);
      background: var(--surface-2); cursor: pointer;
      font-size: 12px; font-weight: 600; color: var(--primary);
      border: 1px solid var(--border); transition: background 0.15s;
    }

    /* ── FAB ───────────────────────────────────────────── */
    .fab-wrap {
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .fab-wrap::before {
      content: '';
      position: absolute;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(30, 58, 95, 0.3);
      animation: pulseRing 2.6s cubic-bezier(0.215,0.61,0.355,1) infinite;
      pointer-events: none;
    }
    .fab-wrap::after {
      content: '';
      position: absolute;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: rgba(30, 58, 95, 0.15);
      animation: pulseRing 2.6s cubic-bezier(0.215,0.61,0.355,1) 0.8s infinite;
      pointer-events: none;
    }

    /* ── Card hover lift + glow ────────────────────────── */
    .card-hover {
      transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1),
                  box-shadow 0.2s ease !important;
    }
    .card-hover:hover {
      transform: translateY(-3px) !important;
      box-shadow: 0 10px 28px rgba(0,0,0,0.12), 0 0 0 1px var(--border) !important;
    }
    .card-hover:active {
      transform: scale(0.985) !important;
      box-shadow: var(--shadow-sm) !important;
      transition-duration: 0.1s !important;
    }

    /* ── Row tap highlight ─────────────────────────────── */
    .row-tap {
      transition: background 0.12s ease, transform 0.12s ease;
      border-radius: 8px;
      margin: 0 -8px;
      padding-left: 8px !important;
      padding-right: 8px !important;
    }
    .row-tap:active {
      background: var(--surface-2);
      transform: scale(0.99);
    }

    /* ── Skeleton shimmer ──────────────────────────────── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface-2) 25%, var(--border) 50%, var(--surface-2) 75%);
      background-size: 200% auto;
      animation: shimmer 1.4s linear infinite;
      border-radius: var(--r-md);
    }

    /* ── Stat card number ──────────────────────────────── */
    .stat-num {
      display: inline-block;
      animation: countUp 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    /* ── Button ripple container ───────────────────────── */
    .btn-ripple {
      position: relative;
      overflow: hidden;
    }
    .btn-ripple .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.32);
      transform: scale(0);
      animation: ripple 0.55s linear forwards;
      pointer-events: none;
    }

    /* ── Input focus glow ──────────────────────────────── */
    .input-glow:focus {
      border-color: var(--primary) !important;
      box-shadow: 0 0 0 3px rgba(30,58,95,0.12) !important;
      outline: none !important;
    }

    /* ── Tab active indicator ──────────────────────────── */
    .tab-indicator {
      position: absolute;
      bottom: 20px;
      height: 3px;
      background: var(--primary);
      border-radius: 2px;
      transition: left 0.3s cubic-bezier(0.34,1.56,0.64,1),
                  width 0.3s cubic-bezier(0.34,1.56,0.64,1);
    }
    .tab-btn-active {
      animation: iconBounce 0.38s cubic-bezier(0.34,1.56,0.64,1) both;
    }

    /* ── Progress bar animated fill ───────────────────── */
    .progress-fill {
      transition: width 0.8s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* ── Nav glow dot ──────────────────────────────────── */
    .nav-dot {
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--primary);
      margin-top: 2px;
      transform-origin: center;
      transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1),
                  opacity  0.3s ease;
    }
    .nav-dot-hidden { transform: scale(0); opacity: 0; }
    .nav-dot-visible { transform: scale(1); opacity: 1; }

    /* ── Floating avatar ring ──────────────────────────── */
    .avatar-ring:hover {
      box-shadow: 0 0 0 3px rgba(30,58,95,0.2), 0 0 12px rgba(30,58,95,0.15);
      transition: box-shadow 0.2s ease;
    }

    /* ── Stat card float ───────────────────────────────── */
    .stat-float:hover {
      animation: float 2s ease-in-out infinite;
    }

    /* ── Donut SVG draw animation ──────────────────────── */
    .donut-arc {
      stroke-dashoffset: 0;
      transition: stroke-dasharray 1.2s cubic-bezier(0.34,1.56,0.64,1);
    }

    /* ── Sections banner gradient ──────────────────────── */
    .header-gradient {
      background: linear-gradient(150deg, var(--primary) 0%, #142d4c 60%, #0e2038 100%);
      position: relative;
      overflow: hidden;
    }
    .header-gradient::after {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 80% 50%,
        rgba(255,255,255,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    /* ── Orb ambient decorations ───────────────────────── */
    .orb {
      position: absolute; border-radius: 50%;
      pointer-events: none; will-change: transform;
    }
    .orb-1 {
      width: 110px; height: 110px;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, transparent 70%);
      top: -30px; right: -20px;
      animation: orb-drift 8s ease-in-out infinite;
    }
    .orb-2 {
      width: 70px; height: 70px;
      background: radial-gradient(circle, rgba(107,239,160,0.12) 0%, transparent 70%);
      bottom: 10px; right: 30px;
      animation: orb-drift 10s ease-in-out 2s infinite reverse;
    }
    .orb-3 {
      width: 50px; height: 50px;
      background: radial-gradient(circle, rgba(96,174,254,0.15) 0%, transparent 70%);
      top: 40px; left: -10px;
      animation: orb-drift 7s ease-in-out 1s infinite;
    }
  </style>
</head>
<body>
  <div id="app-root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"
    integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
    integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
    crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
    integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
    crossorigin="anonymous"></script>

  <!-- 1. Data (plain JS — available globally before React mounts) -->
  <script src="data.js"></script>

  <!-- 2. iOS Frame component -->
  <script type="text/babel" src="ios-frame.jsx"></script>

  <!-- 3. Shared UI primitives -->
  <script type="text/babel" src="components/UI.jsx"></script>

  <!-- 4. Layout scaffolding -->
  <script type="text/babel" src="components/Layout.jsx"></script>

  <!-- 5. Screens -->
  <script type="text/babel" src="screens/Dashboard.jsx"></script>
  <script type="text/babel" src="screens/Statistics.jsx"></script>
  <script type="text/babel" src="screens/Semestres.jsx"></script>
  <script type="text/babel" src="screens/InterventionDetail.jsx"></script>
  <script type="text/babel" src="screens/Settings.jsx"></script>
  <script type="text/babel" src="screens/Patients.jsx"></script>
  <script type="text/babel" src="screens/NewIntervention.jsx"></script>

  <!-- 6. App router + mount -->
  <script type="text/babel" src="App.jsx"></script>
</body>
</html>
